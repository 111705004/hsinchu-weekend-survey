<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>問卷數據後台</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="adm">
<header class="sv-top">
  <span class="brand"><i>竹</i>問卷數據</span>
  <span class="sv-count" id="n"></span>
</header>
<main class="ad-main">
  <section id="login" class="ad-login">
    <h1>新竹人週末調查・後台</h1>
    <p class="lead">輸入團隊的管理密碼（Apps Script 指令碼屬性裡的 <code>ADMIN_KEY</code>）。密碼只存在這個分頁，關掉就清掉。</p>
    <form id="loginForm" class="acts">
      <label class="f grow">管理密碼<input type="password" id="key" autocomplete="current-password" required></label>
      <button class="btn" type="submit">載入數據</button>
    </form>
    <p class="err" id="loginErr" role="alert"></p>
    <p class="note">還沒接上試算表時：<button type="button" class="link" id="localBtn">改看這台裝置暫存的回覆</button></p>
  </section>
  <section id="dash" hidden>
    <div class="ad-filters" role="group" aria-label="篩選">
      <label class="f">身分<select id="fRole"></select></label>
      <label class="f">類型<select id="fType"></select></label>
      <label class="f">年齡<select id="fAge"></select></label>
      <label class="f">來源<select id="fSrc"></select></label>
      <div class="acts ex">
        <button class="btn ghost" type="button" id="exCsv">匯出回覆 CSV</button>
        <button class="btn ghost" type="button" id="exPocket">匯出口袋名單 CSV</button>
      </div>
    </div>
    <div id="out"></div>
    <section class="ad-sec" id="lottery"></section>
  </section>
</main>
<script src="assets/config.js"></script>
<script src="assets/questions.js"></script>
<script src="assets/admin.js"></script>
</body>
</html>
